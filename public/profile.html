<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kirim Pesan Anonim - {{USERNAME}}</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
  <style>
    /* semua style tetap seperti yang sebelumnya */
    /* ... potongan style tidak ditampilkan untuk singkat ... */
  </style>
</head>
<body class="profile-page-body">

  <div class="main-content">
    <div class="message-box">
      <div class="user-header">
        <img src="{{AVATAR_URL}}" alt="Avatar" class="user-avatar" id="user-avatar-img">
        <div class="user-details">
          <div class="username" id="profile-username-display">@{{USERNAME}}</div>
          <div class="user-prompt" id="profile-prompt-display">{{PROMPT_TEXT}}</div>
        </div>
      </div>
      <form id="send-message-form">
        <textarea id="message-content" rows="4" placeholder="kirim pesan anonim padaku..." required></textarea>
        <span class="dice-icon" id="dice-button">🎲</span>
        <button type="submit" id="send-button">Kirim!</button>
      </form>
    </div>

    <div class="anon-qa">
      <i class="fas fa-lock"></i> tanya-jawab anonim
    </div>

    <p id="send-status" class="message"></p>
    <div id="polls-container" style="width: 100%;"></div>

    <div class="hit-counter">
      <i class="fas fa-hand-point-up"></i> 286 orang baru saja mengetuk tombol ini <i class="fas fa-hand-point-up fa-flip-horizontal"></i>
    </div>

    <a href="/" class="get-own-button">Dapatkan pesan untukmu sendiri!</a>
  </div>

  <footer class="page-footer">
    <div class="footer-links">
      <a href="#">Terms</a>
      <a href="#">Privacy</a>
    </div>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const pathPartsJS = window.location.pathname.split('/');
      const recipientUsername = pathPartsJS[pathPartsJS.length - 1];
      const messageForm = document.getElementById('send-message-form');
      const messageContent = document.getElementById('message-content');
      const sendButton = document.getElementById('send-button');
      const sendStatus = document.getElementById('send-status');
      const diceButton = document.getElementById('dice-button');
      const prompts = [
        "Apa rahasia terbesarmu?", "Ceritakan lelucon!", "Apa hal paling memalukan?",
        "Jika punya kekuatan super, apa?", "Pendapat jujurmu tentangku?", "Rekomendasi lagu.",
        "Mimpi teranehmu?", "Hal bahagia hari ini?", "Satu hal ingin kamu ubah?",
        "Deskripsikan dirimu 3 kata.", "Apa yang kamu takuti?", "Apa keinginan terbesar kamu?"
      ];

      diceButton.addEventListener('click', () => {
        const randomPrompt = prompts[Math.floor(Math.random() * prompts.length)];
        messageContent.value = randomPrompt;
      });

      messageForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const message = messageContent.value.trim();
        if (!message) return;

        sendButton.disabled = true;
        sendButton.innerHTML = '<i class="fa fa-spinner fa-spin"></i> Mengirim...';
        sendStatus.textContent = '';

        try {
          const res = await fetch(`/api/message/${recipientUsername}`, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json'
            },
            body: JSON.stringify({ message })
          });

          const json = await res.json();

          if (json.success) {
            sendStatus.textContent = 'Pesan berhasil dikirim!';
            sendStatus.className = 'message success';
            messageContent.value = '';
          } else {
            sendStatus.textContent = 'Gagal mengirim pesan.';
            sendStatus.className = 'message error';
          }
        } catch (err) {
          sendStatus.textContent = 'Terjadi kesalahan saat mengirim.';
          sendStatus.className = 'message error';
        } finally {
          sendButton.disabled = false;
          sendButton.innerHTML = 'Kirim!';
        }
      });
    });
  </script>
</body>
</html>
